name: Lichess Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guncel Bot ve Motor Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish curl jq
          H="github.com"
          U="lichess-bot-devs"
          R="lichess-bot.git"
          git clone "https://$H/$U/$R" resmi_bot
          cp config.yml resmi_bot/config.yml
          mkdir -p resmi_bot/engines
          cp /usr/games/stockfish resmi_bot/engines/fairy-stockfish
          chmod +x resmi_bot/engines/fairy-stockfish
          cd resmi_bot
          pip install -r requirements.txt
      - name: Botu Proxy ile Baslat
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          cd resmi_bot
          sed -i "s/^token:.*/token: \"$LICHESS_BOT_TOKEN\"/" config.yml
          PROXY=$(curl -s "https://proxyscrape.com" | head -n 1 | tr -d '\r')
          echo "Kullanilan Proxy: $PROXY"
          if [ -n "$PROXY" ]; then
            export HTTP_PROXY="http://$PROXY"
            export HTTPS_PROXY="http://$PROXY"
          fi
          python3 lichess-bot.py
