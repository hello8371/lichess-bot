name: Lichess Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fairy-Stockfish ve Bot Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip
          H="github.com"
          U="lichess-bot-devs"
          R="lichess-bot.git"
          git clone "https://$H/$U/$R" resmi_bot
          cp config.yml resmi_bot/config.yml
          mkdir -p resmi_bot/engines
          FS_U="fairy-stockfish"
          FS_R="Fairy-Stockfish"
          curl -L "https://$H/$FS_U/$FS_R/releases/download/fairy_sf_14_0_1/fairy-stockfish-largeboard_x86-64" -o resmi_bot/engines/fairy-stockfish
          chmod +x resmi_bot/engines/fairy-stockfish
          cd resmi_bot
          pip install -r requirements.txt
      - name: Botu Calisan Proxy ile Baslat
        env:
          LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          cd resmi_bot
          sed -i "s/^token:.*/token: \"$LICHESS_BOT_TOKEN\"/" config.yml
          P_HOST="://githubusercontent.com"
          P_PATH="TheSpeedX/PROXY-List/master/http.txt"
          curl -s "https://$P_HOST/$P_PATH" | head -n 50 > proxies.txt
          for P in $(cat proxies.txt | tr -d '\r'); do
            if curl -s -x "http://$P" --connect-timeout 3 "https://lichess.org" | grep -q "api"; then
              echo "Calisan Proxy Bulundu: $P"
              export HTTP_PROXY="http://$P"
              export HTTPS_PROXY="http://$P"
              break
            fi
          done
          python3 lichess-bot.py
